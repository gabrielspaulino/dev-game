name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Backend: Java 21 + Maven
  # ============================================================
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest

    services:
      # Testcontainers creates its own PostgreSQL — this service is not used
      # by integration tests, but is kept for reference.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: devlearn_ci
          POSTGRES_USER: devlearn
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: cd backend && ./mvnw -B compile -q

      - name: Run unit tests
        run: cd backend && ./mvnw -B test -q

      - name: Run integration tests
        run: cd backend && ./mvnw -B verify -q
        env:
          # Testcontainers pulls its own Docker image — Docker is available on GitHub Actions runners
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # ============================================================
  # Frontend: Node.js + pnpm
  # ============================================================
  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @workspace/frontend run typecheck

      - name: Lint
        run: pnpm --filter @workspace/frontend run lint --if-present

      - name: Run unit tests
        run: pnpm --filter @workspace/frontend run test --if-present

      - name: Build
        run: pnpm --filter @workspace/frontend run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://placeholder.example.com/api
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          PORT: 5173
          BASE_PATH: /
