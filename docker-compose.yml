version: '3.9'

# Local development services.
# Production uses Supabase — this file is for local development only.
# Usage: docker-compose up -d
#
# Services:
#   postgres: PostgreSQL 15, exposed on localhost:5432
#
# Credentials match backend/.env.example defaults for local dev.
# Never use these credentials in staging or production.

services:
  postgres:
    image: postgres:15-alpine
    container_name: devlearn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devlearn_dev
      POSTGRES_USER: devlearn
      POSTGRES_PASSWORD: devlearn_local_dev_only
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devlearn -d devlearn_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
