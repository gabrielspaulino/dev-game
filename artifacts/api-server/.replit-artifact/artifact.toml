kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "sh -c 'cd /home/runner/workspace/backend && mvn -B package -Dmaven.test.skip=true -q && exec java -Dspring.profiles.active=replit -jar target/devlearn-backend-*.jar'"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/backend && mvn -B package -Dmaven.test.skip=true -q"]

[services.production.run]
args = ["sh", "-c", "exec java -jar /home/runner/workspace/backend/target/devlearn-backend-*.jar"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
